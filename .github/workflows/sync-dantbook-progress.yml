name: Sync DantBook progress from GitHub

on:
  schedule:
    - cron: "*/5 * * * *" # Every 5 minutes (UTC)
  push:
    branches: [main]
    paths:
      - "scripts/sync_dantbook_github.py"
      - "scripts/progress_evidence.py"
      - ".github/workflows/sync-dantbook-progress.yml"
      - "progress-manifest.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dantbook-progress-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard status repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch private GitHub metadata and evidence-reviewed progress
        env:
          DANTBOOK_REPO_READ_TOKEN: ${{ secrets.DANTBOOK_REPO_READ_TOKEN }}
        run: python scripts/sync_dantbook_github.py
      - name: Commit and push status updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No dashboard changes."
            exit 0
          fi
          git add status.json CURRENT_TASK.md CHANGELOG.md
          git commit -m "chore: sync verified DantBook GitHub status"
          git push
