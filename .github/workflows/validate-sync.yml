name: Validate dashboard sync automation

on:
  pull_request:
    paths:
      - ".github/workflows/sync-dantbook-progress.yml"
      - ".github/workflows/validate-sync.yml"
      - "scripts/sync_dantbook_github.py"
      - "scripts/progress_evidence.py"
      - "DESKTOP_FEED_CONTRACT.md"
      - "tests/**"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile sync and evidence modules
        run: python -m py_compile scripts/sync_dantbook_github.py scripts/progress_evidence.py
      - name: Run evidence mapping unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate YAML syntax
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import yaml
          for path in (".github/workflows/sync-dantbook-progress.yml", ".github/workflows/validate-sync.yml"):
              with open(path, encoding="utf-8") as f:
                  yaml.safe_load(f)
              print("YAML syntax OK:", path)
          PY
      - name: Check whitespace
        run: git diff --check
