name: Validate dashboard sync

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check sync script
        run: python -m py_compile scripts/sync_dantbook_github.py
      - name: Validate JSON and manifest consistency
        run: |
          python - <<'PY'
          import json
          with open("status.json", encoding="utf-8") as f:
              status = json.load(f)
          with open("progress-manifest.json", encoding="utf-8") as f:
              progress = json.load(f)
          for key in ("overall_progress_percent",):
              value = progress[key]
              assert isinstance(value, int) and 0 <= value <= 100, f"invalid {key}: {value}"
          for collection in ("modules", "milestones"):
              for item in progress[collection]:
                  value = item["progress_percent"]
                  assert isinstance(value, int) and 0 <= value <= 100, f"invalid {collection} value: {item}"
          assert status["overall_progress_percent"] == progress["overall_progress_percent"]
          assert status["modules"] == progress["modules"]
          assert status["milestones"] == progress["milestones"]
          manifest_steps = {step["id"]: step for step in progress["task_steps"]}
          live_steps = {step["id"]: step for step in status["task_steps"]}
          assert set(manifest_steps) == set(live_steps), "task step IDs differ from manifest"
          for step_id, step in manifest_steps.items():
              if step.get("pr"):
                  continue
              live_status = live_steps[step_id]["status"]
              assert live_status == step["status"], f"{step_id}: status {live_status} differs from manifest {step['status']}"
              if step["status"] in ("blocked", "pending"):
                  assert live_status != "completed", f"{step_id}: blocked/pending gap must not be completed"
          print("JSON valid; progress, modules, milestones and non-PR checkpoint statuses match manifest.")
          PY
